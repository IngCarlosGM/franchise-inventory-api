services:
  postgres:
    image: postgres:17-alpine
    container_name: franchise-inventory-db
    environment:
      POSTGRES_DB: franchise_inventory
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d franchise_inventory"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data: